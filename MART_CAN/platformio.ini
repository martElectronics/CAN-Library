; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino

build_unflags = -std=gnu++11
build_flags = -std=gnu++17


[env:main]
build_src_filter = +<*.*> -<GeneralSender.cpp> -<GeneralReceiver.cpp> -<ReadIverterMessage.cpp> -<testRRF.cpp>
build_flags = ${env.build_flags}

[env:GeneralSender]
build_src_filter = +<*.*> -<main.cpp> -<GeneralReceiver.cpp> -<ReadIverterMessage.cpp> -<testRRF.cpp>
build_flags = ${env.build_flags}

[env:GeneralReceiver]
build_src_filter = +<*.*> -<main.cpp> -<GeneralSender.cpp> -<ReadIverterMessage.cpp> -<testRRF.cpp>
build_flags = ${env.build_flags}

[env:ReadIverterMessage]
build_src_filter = +<*.*> -<main.cpp> -<GeneralSender.cpp> -<GeneralReceiver.cpp> -<testRRF.cpp>
build_flags = ${env.build_flags}

[env:testRRF]
build_src_filter = +<*.*> -<main.cpp> -<GeneralSender.cpp> -<GeneralReceiver.cpp> -<ReadIverterMessage.cpp>
build_flags = ${env.build_flags}